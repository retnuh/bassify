# Per-track render overrides for the BluesBass collection.
#
# Keyed by the SOURCE track stem (the filename without extension, e.g.
# "19_Walking Jazz Blues In F"). Render looks up each track here before falling
# back to librosa auto-detection.
#
# Fields (all optional; schema kept extensible for future freq_range/title):
#   key: musical key as "<root>" or "<root>m" (e.g. "F", "A", "Bm", "F#m").
#        Only the ROOT drives the axis label tiers (blues-scale sizing); the
#        major/minor quality is recorded for posterity but not used for sizing.
#        Set to null (or omit) for genuinely multi-key tracks — render then
#        falls back to neutral, equal-weight labels (no blues tiers), which is
#        the correct behaviour when no single key applies.
#
# These entries were taken from the course book (Aug 2026) to correct
# auto-detection misses.
#
#   videos: [{title, url}] -- up to a few real YouTube links to the ORIGINAL
#        recording(s) this track's exercise is based on (found by research,
#        Aug 2026; every URL below is a real search result, not guessed).
#        Rendered into the track's _youtube_description.txt sidecar (see
#        description_template below) by `bassify describe`. Only present on
#        tracks named after an actual blues standard -- the generic teaching
#        exercises (Box Shape Examples, Boogie Line, etc.) have nothing to
#        link to and are omitted.

# Collection-level blurb template for _youtube_description.txt (stdlib
# string.Template -- $identifiers only, no expressions/conditionals). Optional
# fields ($key_line, $bpm_line, $videos_block) are pre-formatted into whole
# lines/blocks and come through as "" when the data is missing, not as a bare
# $placeholder -- see render/description.py. Falls back to description.py's
# own DEFAULT_TEMPLATE if this key is absent.
description_template: |
  $title_line

  Bass-only practice track from Hal Leonard's "Blues Bass: A Guide to the
  Essential Styles and Techniques" by Ed Friedland -- isolated bass line,
  with the original count-in and narration left intact so it's still
  practice-along ready.
  $key_line$bpm_line
  Book: $book_url
  $videos_block
  Generated with bassify: $project_url

  #bassguitar #basscover #bluesbass #basslesson

overrides:
  # Auto-detected A min, but the title says F and it is in F. Root F.
  "19_Walking Jazz Blues In F":
    key: F

  # Short track in A. Auto-detected C# maj (lowest confidence, r=0.60).
  "12_Box Shape Examples":
    key: A

  # Short track; F major but every chord is F7, so all notes are root/5th/b7/
  # octave with no 3rd — auto-detect reasonably read it as F min. Root F.
  "08_Uptown Up_Uptown Down":
    key: F

  # "The Thrill Is Gone" — the famous B-minor tune. Auto-detected F# maj (the
  # 5th). Root B.
  "40_The Thrill Is Gone":
    key: Bm
    videos:
      - title: "B.B. King - The Thrill Is Gone (1969)"
        url: "https://www.youtube.com/watch?v=oica5jG7FpU"
      - title: "B.B. King - The Thrill Is Gone (from Completely Well)"
        url: "https://www.youtube.com/watch?v=kpC69qIe02E"

  # F# minor (part of it touches F# major; we use F# minor). Root F#.
  "41_All Your Love":
    key: F#m
    videos:
      - title: "Otis Rush - All Your Love (I Miss Loving) [Cobra 5032, 1958]"
        url: "https://www.youtube.com/watch?v=eAFPgAxZGJ0"
      - title: "Otis Rush - All Your Love (I Miss Loving)"
        url: "https://www.youtube.com/watch?v=O3hrVFvxTfk"

  # Teaching track cycling intros through multiple keys (A -> G -> C -> F# -> C).
  # No single key applies -> keyless -> neutral labels.
  "26_Intros From The Five":
    key: null

  # Teaching track cycling intros through multiple keys. Keyless -> neutral labels.
  "27_Intros From The Four":
    key: null

  # --- Original recordings, researched Aug 2026 (see the description_template
  # comment above for how these render). No key override here -- only videos.

  # Original Albert King instrumental (1962 B-side to "Travelin' To California"),
  # not a cover.
  "06_Dyna Flow":
    videos:
      - title: "Albert King - Dyna Flow (1962)"
        url: "https://www.youtube.com/watch?v=NBQ4HGsCEW4"
      - title: "Albert King - Dyna flow"
        url: "https://www.youtube.com/watch?v=VeLG58EW4gY"

  # Junior Wells, 1960, Chief Records, written by Mel London. Same song as
  # track 10 (register variants of the same exercise) -- same videos.
  "09_Messin' With The Kid Higher Register":
    videos:
      - title: "Junior Wells - Messin' With The Kid"
        url: "https://www.youtube.com/watch?v=X-9_hsLhX0w"
      - title: "Junior Wells - Messin' With The Kid"
        url: "https://www.youtube.com/watch?v=cWTieCjUhVw"

  "10_Messin' With The Kid Lower Register":
    videos:
      - title: "Junior Wells - Messin' With The Kid"
        url: "https://www.youtube.com/watch?v=X-9_hsLhX0w"
      - title: "Junior Wells - Messin' With The Kid"
        url: "https://www.youtube.com/watch?v=cWTieCjUhVw"

  # Jimmy Reed, 1960/61, Vee-Jay.
  "17_Big Boss Man":
