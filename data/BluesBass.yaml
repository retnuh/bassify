        url: "https://www.youtube.com/watch?v=j8q6gxgG-9Q"
      - title: "Professor Longhair - Mardi Gras in New Orleans"
        url: "https://www.youtube.com/watch?v=LR82f0GJgXg"

  # Two prominent originals: Tommy McClennan's 1941 "Cross Cut Saw Blues" is
  # the true original; Albert King's 1966 Stax reworking (Latin/Afro-Cuban
  # beat, Booker T & the MGs) is the version most bass players reference.
  "25_Crosscut Saw":
    videos:
      - title: "Albert King - Crosscut Saw (Official Audio)"
        url: "https://www.youtube.com/watch?v=Fb3EMo6Hlnk"
      - title: "Albert King - Crosscut Saw"
        url: "https://www.youtube.com/watch?v=wUBMJk3syzI"
      - title: "Tommy McClennan - Cross Cut Saw Blues (1941, true original)"
        url: "https://www.youtube.com/watch?v=8DMzJuYCzm4"

  # Little Walter, 1955, Checker/Chess, written by Willie Dixon.
  "30_My Babe":
    videos:
      - title: "Little Walter - My Babe (1955, #1 R&B hit for 5 weeks)"
        url: "https://www.youtube.com/watch?v=psWlV07ng2w"
      - title: "Little Walter - My Babe [1955]"
        url: "https://www.youtube.com/watch?v=MkYzb4Jzx8k"

  # Two prominent versions: Big Bill Broonzy co-wrote and recorded the
  # original (1941, with Jazz Gillum); Derek and the Dominos' 1970 "Layla"
