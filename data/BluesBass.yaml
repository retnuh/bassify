        url: "https://www.youtube.com/watch?v=XklUL-3v9Dc"
      - title: "Jimmy Reed - Big Boss Man (Official Audio)"
        url: "https://www.youtube.com/watch?v=JhTGqS2Pbsw"

  # Eddie "Cleanhead" Vinson, "Kidney Stew Blues", 1947.
  "18_Kidney Stew":
    videos:
