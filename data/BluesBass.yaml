        url: "https://www.youtube.com/watch?v=kHwHZOgKKvw"
      - title: "Blues After Hours - Pee Wee Crayton (RPM Records)"
        url: "https://www.youtube.com/watch?v=wMGkLflNJlg"

  # Professor Longhair, 1949.
  "24_Mardi Gras In New Orleans":
